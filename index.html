<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極限心機：微型海戰桌遊 (全景併排版)</title>
    <style>
        :root {
            --bg-color: #1a252f;
            --card-bg: #2c3e50;
            --text-color: #ecf0f1;
            --accent-color: #e74c3c;
            --sea-color: #34495e;
            --sea-hidden: #2980b9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 10px; color: #3498db; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .setup-screen, .game-screen {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 1400px;
            width: 100%;
            box-sizing: border-box;
        }
        .setup-screen { max-width: 600px; text-align: center; }
        .input-card {
            background: rgba(0,0,0,0.2);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .input-group-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-group-row div { flex: 1; text-align: left; }
        .input-group-row label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        .input-group-row input { width: 100%; padding: 8px; border-radius: 6px; border: none; box-sizing: border-box; }
        
        button {
            background-color: #2ecc71; color: white; border: none; padding: 10px 20px;
            font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        button:hover { background-color: #27ae60; transform: translateY(-2px); }
        .btn-restart {
            background-color: #e67e22; color: white; border: none; padding: 8px 16px;
            font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
            margin-left: 15px;
        }
        .btn-restart:hover { background-color: #d35400; transform: translateY(-2px); }
        .hidden { display: none !important; }
        
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #34495e; padding-bottom: 15px; }
        
        .main-layout { display: flex; gap: 30px; flex-direction: column; align-items: center; width: 100%; }
        .setup-area { display: flex; gap: 20px; width: 100%; justify-content: center; align-items: flex-start; }
        .shop-panel { width: 250px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; flex-shrink: 0; }
        .shop-item {
            background: #34495e; margin: 10px 0; padding: 10px; border-radius: 6px;
            cursor: grab; display: flex; align-items: center; justify-content: space-between;
            border: 2px solid transparent; user-select: none;
        }
        .shop-item:hover { border-color: #3498db; background: #3d566e; }
        .orientation-control { display: flex; gap: 10px; margin-bottom: 15px; }
        .orient-btn { flex: 1; background: #7f8c8d; padding: 5px; font-size: 14px; border-radius: 4px; color: white; cursor: pointer; border: none; }
        .orient-btn.active { background: #3498db; }
        
        .battle-area { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .team-container { background: rgba(0,0,0,0.15); padding: 15px; border-radius: 10px; border: 2px solid #465866; display: flex; flex-direction: column; align-items: center; }
        .team-container.active-turn { border-color: #f1c40f; box-shadow: 0 0 15px rgba(241, 196, 15, 0.4); }
        .team-container.eliminated { opacity: 0.4; border-color: #7f8c8d; background: rgba(0,0,0,0.4); }
        .team-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; text-align: center; }

        .board-wrapper { display: grid; grid-template-columns: 30px 1fr; grid-template-rows: 30px 1fr; align-items: center; justify-items: center; }
        .axis-row { grid-column: 2; grid-row: 1; display: grid; grid-template-columns: repeat(6, 50px); gap: 4px; font-weight: bold; color: #3498db; text-align: center; line-height: 30px; width: 100%; }
        .axis-col { grid-column: 1; grid-row: 2; display: grid; grid-template-rows: repeat(6, 50px); gap: 4px; font-weight: bold; color: #3498db; align-content: center; height: 100%; text-align: center; line-height: 50px; }
        
        .board { grid-column: 2; grid-row: 2; display: grid; grid-template-columns: repeat(6, 50px); grid-template-rows: repeat(6, 50px); gap: 4px; background: #1a252f; padding: 6px; border-radius: 6px; }
        .cell {
            background-color: var(--sea-color); border-radius: 4px; display: flex; align-items: center;
            justify-content: center; font-size: 20px; cursor: pointer; position: relative; transition: 0.2s;
            box-sizing: border-box; border: 1px solid rgba(255,255,255,0.05);
        }
        
        .border-scout { border: 2px solid #00ffff !important; }
        .border-scoutShip { border: 2px solid #ffaa00 !important; }
        .border-warship { border: 2px solid #ff3333 !important; }
        .border-torpedo { border: 2px solid #9b59b6 !important; }

        .setup-mode .cell { background-color: var(--sea-color); }
        .battle-mode .cell { background-color: var(--sea-hidden); border: none; }
        .battle-mode .cell:hover { background-color: #29b6f6; }
        
        .cell.hit { background-color: #c0392b !important; pointer-events: none; }
        .cell.miss { background-color: #1abc9c !important; pointer-events: none; }
        .cell.scouted { background-color: #27ae60 !important; }
        
        .status-bar { font-size: 16px; margin: 5px 0; font-weight: bold; background: #111; padding: 6px 12px; border-radius: 6px; display: inline-block; text-align: center;}
        .log-box { width: 100%; max-height: 150px; overflow-y: auto; background: #111; padding: 10px; border-radius: 6px; margin-top: 15px; font-family: monospace; font-size: 14px; box-sizing: border-box;}
        .log-entry { margin: 4px 0; color: #f1c40f; }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; text-align: center;}
        .overlay h2 { font-size: 48px; color: #f1c40f; margin-bottom: 20px; }
        .overlay-btns { display: flex; gap: 15px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>⚓ 極限心機：微型海戰桌遊 ⚓</h1>

    <div id="setupScreen" class="setup-screen">
        <h3>遊戲初始化設定</h3>
        <div style="margin-bottom: 15px; text-align: left;">
            <label for="playerCount" style="font-weight: bold; display: block; margin-bottom: 5px;">選擇對戰組數 (2~6人)：</label>
            <input type="number" id="playerCount" min="2" max="6" value="3" onchange="generateInputs()" style="width: 100%; padding: 8px; border-radius: 6px; border: none; box-sizing: border-box;">
        </div>
        <div id="inputsContainer"></div>
        <button onclick="startGameSetup()" style="width: 100%; margin-top: 10px;">進入軍備配置模式</button>
    </div>

    <div id="gameScreen" class="game-screen hidden">
        <div class="game-header">
            <div>
                <span id="gamePhaseText" style="font-size: 20px; color: #f1c40f; font-weight: bold;">[ 配置階段 - <span id="currentSetupTeamName" style="color: #3498db;">第 1 組</span> ]</span>
                <div id="turnIndicator" class="status-bar hidden">目前輪到：<span id="currentTurnName" style="color:#e74c3c;">-</span> 攻擊</div>
            </div>
            <div>
                <button id="actionBtn" onclick="handleNextSetupStep()" style="background-color: #3498db;">下一組 ➔</button>
                <button id="restartBtn" class="btn-restart hidden" onclick="confirmRestart()">🔄 重新開始 (保留配置)</button>
            </div>
        </div>

        <div class="main-layout">
            <div id="setupArea" class="setup-area">
                <div id="shopPanel" class="shop-panel">
                    <h3 style="margin-top:0;">⚓ 軍備商店</h3>
                    <div class="orientation-control">
                        <button id="btnH" class="orient-btn active" onclick="setOrientation('H')">水平 ⬌</button>
                        <button id="btnV" class="orient-btn" onclick="setOrientation('V')">垂直 ⬋</button>
                    </div>
                    <div style="font-size:13px; color:#bdc3c7; margin-bottom:10px;">請拖曳道具至右側盤面：<br>(已放置道具可拖離開盤面或點擊取消)</div>
                    
                    <div class="shop-item" draggable="true" ondragstart="drag(event, 'scout', 1, 20)">
                        <span>📡 偵查哨 (1x1)</span><span style="color:#f1c40f;">$20</span>
                    </div>
                    <div class="shop-item" draggable="true" ondragstart="drag(event, 'scoutShip', 2, 25)">
                        <span>🛶 偵查艦 (2x1)</span><span style="color:#f1c40f;">$25</span>
                    </div>
                    <div class="shop-item" draggable="true" ondragstart="drag(event, 'warship', 3, 40)">
                        <span>🚢 軍艦 (3x1)</span><span style="color:#f1c40f;">$40</span>
                    </div>
                    <div class="shop-item" draggable="true" ondragstart="drag(event, 'torpedo', 1, 15)">
                        <span>🚀 魚雷 (1x1)</span><span style="color:#f1c40f;">$15</span>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; align-items: center;">
                    <div>
                        <span class="status-bar">剩餘預算: <span id="currentBudget" style="color:#2ecc71;">$0</span></span>
                        <span class="status-bar">已放道具: <span id="currentItemCount" style="color:#f39c12;">0</span>/8</span>
                    </div>
                    <div id="singleBoardWrapper" class="board-wrapper"></div>
                </div>
            </div>

            <div id="battleArea" class="battle-area hidden"></div>
        </div>

        <div class="log-box" id="logBox">
            <div class="log-entry">系統：遊戲已初始化，請依序幫各組配置船艦（上限 8 個道具）。</div>
        </div>
    </div>

    <div id="overlayScreen" class="overlay hidden">
        <h2 id="overlayTitle">特殊事件</h2>
        <p id="overlayDesc" style="font-size: 20px; max-width: 600px; white-space: pre-line; line-height: 1.6;"></p>
        <div id="overlayActionArea" style="margin-top: 20px;"></div>
    </div>

    <script>
        const ITEM_CONFIGS = {
            scout: { name: '偵查哨', icon: '📡', size: 1, cost: 20, borderClass: 'border-scout' },
            scoutShip: { name: '偵查艦', icon: '🛶', size: 2, cost: 25, borderClass: 'border-scoutShip' },
            warship: { name: '軍艦', icon: '🚢', size: 3, cost: 40, borderClass: 'border-warship' },
            torpedo: { name: '魚雷', icon: '🚀', size: 1, cost: 15, borderClass: 'border-torpedo' }
        };

        let totalTeams = 3;
        let teams = {}; 
        let activeSetupTeamIdx = 1; 
        let currentOrientation = 'H';
        let isBattlePhase = false;
        let currentTurnTeamId = 1;
        let revengeState = null;
        let dragData = null;

        const rowLabels = ['1', '2', '3', '4', '5', '6'];
        const colLabels = ['A', 'B', 'C', 'D', 'E', 'F'];

        function generateInputs() {
            const count = parseInt(document.getElementById('playerCount').value);
            const container = document.getElementById('inputsContainer');
            container.innerHTML = '';
            for(let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div class="input-card">
                        <div class="input-group-row">
                            <div>
                                <label for="name_t${i}">第 ${i} 組 名稱：</label>
                                <input type="text" id="name_t${i}" value="第 ${i} 組">
                            </div>
                            <div>
                                <label for="budget_t${i}">初始預算 ($)：</label>
                                <input type="number" id="budget_t${i}" min="0" value="${150 + (i*10)}">
                            </div>
                        </div>
                    </div>
                `;
            }
        }
        window.onload = generateInputs;

        function startGameSetup() {
            totalTeams = parseInt(document.getElementById('playerCount').value);
            
            for(let i = 1; i <= totalTeams; i++) {
                const teamName = document.getElementById(`name_t${i}`).value.trim() || `第 ${i} 組`;
                const initBudget = parseInt(document.getElementById(`budget_t${i}`).value) || 200;
                teams[i] = {
                    id: i,
                    name: teamName,
                    budget: initBudget,
                    itemCount: 0,
                    eliminated: false,
                    grid: Array(6).fill(null).map(() => Array(6).fill(null)),
                    hits: Array(6).fill(null).map(() => Array(6).fill(false)),
                    revealed: Array(6).fill(null).map(() => Array(6).fill(false))
                };
            }

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            activeSetupTeamIdx = 1;
            updateSetupHeader();
            renderSetupBoard();
            updateStatusDisplay();
        }

        function updateSetupHeader() {
            const currentTeam = teams[activeSetupTeamIdx];
            document.getElementById('currentSetupTeamName').innerText = currentTeam.name;
            const actionBtn = document.getElementById('actionBtn');
            
            if (activeSetupTeamIdx < totalTeams) {
                actionBtn.innerText = "下一組 ➔";
                actionBtn.style.backgroundColor = "#3498db";
            } else {
                actionBtn.innerText = "完成配置，開始戰鬥！ 💥";
                actionBtn.style.backgroundColor = "#e67e22";
            }
        }

        function handleNextSetupStep() {
            if (activeSetupTeamIdx < totalTeams) {
                activeSetupTeamIdx++;
                updateSetupHeader();
                renderSetupBoard();
                updateStatusDisplay();
                log(`🔧 切換至 [${teams[activeSetupTeamIdx].name}] 進行佈署。`);
            } else {
                switchPhase();
            }
        }

        function setOrientation(dir) {
            currentOrientation = dir;
            document.getElementById('btnH').classList.toggle('active', dir === 'H');
            document.getElementById('btnV').classList.toggle('active', dir === 'V');
        }

        function updateStatusDisplay() {
            const currentTeam = teams[activeSetupTeamIdx];
            document.getElementById('currentBudget').innerText = `$${currentTeam.budget}`;
            document.getElementById('currentItemCount').innerText = currentTeam.itemCount;
        }

        function createAxisElements() {
            const axisRow = document.createElement('div');
            axisRow.className = 'axis-row';
            colLabels.forEach(l => {
                const item = document.createElement('div');
                item.innerText = l;
                axisRow.appendChild(item);
            });

            const axisCol = document.createElement('div');
            axisCol.className = 'axis-col';
            rowLabels.forEach(l => {
                const item = document.createElement('div');
                item.innerText = l;
                axisCol.appendChild(item);
            });

            return { axisRow, axisCol };
        }

        function removePlacedItem(teamId, itemId) {
            const currentTeam = teams[teamId];
            let itemType = null;

            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 6; c++) {
                    if (currentTeam.grid[r][c] && currentTeam.grid[r][c].id === itemId) {
                        itemType = currentTeam.grid[r][c].type;
                        currentTeam.grid[r][c] = null;
                    }
                }
            }

            if (itemType && ITEM_CONFIGS[itemType]) {
                const refund = ITEM_CONFIGS[itemType].cost;
                currentTeam.budget += refund;
                currentTeam.itemCount = Math.max(0, currentTeam.itemCount - 1);
                log(`↩️ [${currentTeam.name}] 移除 ${ITEM_CONFIGS[itemType].name}，退還預算 $${refund}`);
            }
        }

        function renderSetupBoard() {
            const wrapper = document.getElementById('singleBoardWrapper');
            wrapper.innerHTML = '';

            const { axisRow, axisCol } = createAxisElements();
            wrapper.appendChild(axisRow);
            wrapper.appendChild(axisCol);

            const board = document.createElement('div');
            board.className = 'board setup-mode';
            board.setAttribute('ondragover', 'allowDrop(event)');

            const currentTeam = teams[activeSetupTeamIdx];

            for(let r = 0; r < 6; r++) {
                for(let c = 0; c < 6; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    const item = currentTeam.grid[r][c];
                    if (item) {
                        cell.innerText = ITEM_CONFIGS[item.type].icon;
                        cell.classList.add(ITEM_CONFIGS[item.type].borderClass);
                        cell.setAttribute('draggable', 'true');
                        
                        cell.ondragstart = (ev) => {
                            ev.dataTransfer.setData('text/plain', JSON.stringify({
                                source: 'board',
                                teamId: activeSetupTeamIdx,
                                itemId: item.id
                            }));
                        };

                        cell.onclick = (ev) => {
                            ev.stopPropagation();
                            removePlacedItem(activeSetupTeamIdx, item.id);
                            renderSetupBoard();
                            updateStatusDisplay();
                        };

                        cell.oncontextmenu = (ev) => {
                            ev.preventDefault();
                            removePlacedItem(activeSetupTeamIdx, item.id);
                            renderSetupBoard();
                            updateStatusDisplay();
                        };
                    }
                    board.appendChild(cell);
                }
            }
            wrapper.appendChild(board);
        }

        function renderBattleArea() {
            const battleArea = document.getElementById('battleArea');
            battleArea.innerHTML = '';

            for (let i = 1; i <= totalTeams; i++) {
                const currentTeam = teams[i];
                
                const container = document.createElement('div');
                container.className = `team-container ${currentTeam.id === currentTurnTeamId ? 'active-turn' : ''} ${currentTeam.eliminated ? 'eliminated' : ''}`;
                
                const title = document.createElement('div');
                title.className = 'team-title';
                title.innerHTML = `${currentTeam.name} ${currentTeam.eliminated ? '[已淘汰 💀]' : ''}<br><span style="font-size:12px;color:#a0a0a0;">剩餘預算: $${currentTeam.budget}</span>`;
                container.appendChild(title);

                const wrapper = document.createElement('div');
                wrapper.className = 'board-wrapper';

                const { axisRow, axisCol } = createAxisElements();
                wrapper.appendChild(axisRow);
                wrapper.appendChild(axisCol);

                const board = document.createElement('div');
                board.className = 'board battle-mode';

                for(let r = 0; r < 6; r++) {
                    for(let c = 0; c < 6; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        
                        cell.onclick = () => handleCellClick(currentTeam.id, r, c);

                        const item = currentTeam.grid[r][c];
                        const isHit = currentTeam.hits[r][c];
                        const isRevealed = currentTeam.revealed[r][c];

                        if (isHit) {
                            if (item) {
                                cell.classList.add('hit');
                                cell.innerText = ITEM_CONFIGS[item.type].icon;
                                cell.classList.add(ITEM_CONFIGS[item.type].borderClass);
                            } else {
                                cell.classList.add('miss');
                                cell.innerText = '💦';
                            }
                        } else if (isRevealed) {
                            cell.classList.add('scouted');
                            if (item) {
                                cell.innerText = ITEM_CONFIGS[item.type].icon;
                                cell.title = `偵查天眼透視：${ITEM_CONFIGS[item.type].name} (需點擊攻擊才算擊沉)`;
                            } else {
                                cell.innerText = '';
                            }
                        } else {
                            cell.innerText = '';
                        }
                        board.appendChild(cell);
                    }
                }
                wrapper.appendChild(board);
                container.appendChild(wrapper);
                battleArea.appendChild(container);
            }
        }

        function drag(ev, type, size, cost) {
            dragData = { source: 'shop', type, size, cost };
            ev.dataTransfer.setData('text/plain', JSON.stringify(dragData));
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        document.addEventListener('dragover', function(ev) {
            ev.preventDefault();
        });

        document.addEventListener('drop', function(ev) {
            if (isBattlePhase) return;
            
            let dataStr = ev.dataTransfer.getData('text/plain');
            if (!dataStr) return;
            let data = null;
            try { data = JSON.parse(dataStr); } catch(e) {}
            
            if (data && data.source === 'board') {
                const boardWrapper = document.getElementById('singleBoardWrapper');
                if (!boardWrapper.contains(ev.target)) {
                    removePlacedItem(data.teamId, data.itemId);
                    renderSetupBoard();
                    updateStatusDisplay();
                }
            }
        });

        document.getElementById('singleBoardWrapper').addEventListener('drop', function(ev) {
            ev.preventDefault();
            ev.stopPropagation();
            if (isBattlePhase) return;

            let dataStr = ev.dataTransfer.getData('text/plain');
            let data = dragData;
            if (dataStr) {
                try { data = JSON.parse(dataStr); } catch(e) {}
            }

            if (!data || data.source === 'board') return;

            const cell = ev.target.closest('.cell');
            if (!cell) return;

            const startR = parseInt(cell.dataset.row);
            const startC = parseInt(cell.dataset.col);
            const currentTeam = teams[activeSetupTeamIdx];

            if (currentTeam.itemCount >= 8) {
                alert(`❌ 部署失敗：${currentTeam.name} 已達道具上限 8 個！`);
                return;
            }

            if (currentTeam.budget < data.cost) {
                alert(`❌ 預算不足！建置需要 $${data.cost}，但該組剩餘 $${currentTeam.budget}`);
                return;
            }

            let cellsToOccupy = [];
            for (let i = 0; i < data.size; i++) {
                let r = startR + (currentOrientation === 'V' ? i : 0);
                let c = startC + (currentOrientation === 'H' ? i : 0);

                if (r >= 6 || c >= 6) {
                    alert("❌ 部署失敗：物件超出海域邊界！");
                    return;
                }
                if (currentTeam.grid[r][c] !== null) {
                    alert("❌ 部署失敗：該位置已有其他軍事配置重疊！");
                    return;
                }
                cellsToOccupy.push({r, c});
            }

            const itemId = '_' + Math.random().toString(36).substr(2, 9);
            cellsToOccupy.forEach(pos => {
                currentTeam.grid[pos.r][pos.c] = {
                    id: itemId,
                    type: data.type,
                    size: data.size
                };
            });

            currentTeam.budget -= data.cost;
            currentTeam.itemCount += 1;

            log(`🔧 幫 [${currentTeam.name}] 部署了 ${ITEM_CONFIGS[data.type].name}，花費 $${data.cost}`);
            
            renderSetupBoard();
            updateStatusDisplay();
            dragData = null;
        });

        function switchPhase() {
            if (!isBattlePhase) {
                isBattlePhase = true;
                document.getElementById('gamePhaseText').innerText = "💥 [ 戰鬥對戰階段 ]";
                document.getElementById('gamePhaseText').style.color = "#e74c3c";
                document.getElementById('setupArea').classList.add('hidden');
                document.getElementById('actionBtn').classList.add('hidden');
                document.getElementById('restartBtn').classList.remove('hidden');
                document.getElementById('battleArea').classList.remove('hidden');
                document.getElementById('turnIndicator').classList.remove('hidden');
                
                currentTurnTeamId = 1;
                determineNextActiveTurn();
                log(`⚔️ 戰鬥正式開始！所有人配置已進入隱蔽迷霧，全場盤面已並排秀出。`);
            }
        }

        function confirmRestart() {
            showOverlay("⚠️ 確定重新開始戰鬥？", "本局將重置戰鬥狀態（所有攻擊記錄與開天眼效果將清空），但會【保留各組原本的艦艇配置】。", () => {
                resetGameKeepLayout();
            }, false, true);
        }

        function resetGameKeepLayout() {
            isBattlePhase = true;
            revengeState = null;
            currentTurnTeamId = 1;

            for (let i = 1; i <= totalTeams; i++) {
                teams[i].eliminated = false;
                teams[i].hits = Array(6).fill(null).map(() => Array(6).fill(false));
                teams[i].revealed = Array(6).fill(null).map(() => Array(6).fill(false));
            }

            log(`🔄 遊戲已重新開始！保留了原先的所有地圖配置。`);
            determineNextActiveTurn();
        }

        function determineNextActiveTurn() {
            let loops = 0;
            while (teams[currentTurnTeamId].eliminated && loops < totalTeams) {
                currentTurnTeamId = (currentTurnTeamId % totalTeams) + 1;
                loops++;
            }
            document.getElementById('currentTurnName').innerText = teams[currentTurnTeamId].name;
            renderBattleArea();
        }

        function handleCellClick(targetTeamId, r, c) {
            if (!isBattlePhase) return;
            
            const targetTeam = teams[targetTeamId];
            const attacker = teams[currentTurnTeamId];

            if (revengeState) {
                if (targetTeamId !== revengeState.attackerId) {
                    alert(`🚨 復仇限制：請點選復仇目標 [${teams[revengeState.attackerId].name}] 的盤面格子！`);
                    return;
                }
                executeRevengeAttack(r, c);
                return;
            }

            if (targetTeamId === currentTurnTeamId) {
                alert("⚠️ 您不能砲擊自己組別的盤面！請選擇其他敵方組別的盤面進行進攻。");
                return;
            }

            if (targetTeam.eliminated) {
                alert("該組別已遭淘汰，請進攻場上其他存活的隊伍！");
                return;
            }

            if (targetTeam.hits[r][c]) {
                alert("這裡已經被砲擊過，請選擇其他海域座標！");
                return;
            }

            targetTeam.hits[r][c] = true;
            const item = targetTeam.grid[r][c];
            const coordStr = `${colLabels[c]}${rowLabels[r]}`;

            if (item) {
                log(`💥 [${attacker.name}] 成功轟炸 [${targetTeam.name}] 的 (${coordStr})，發現 ${ITEM_CONFIGS[item.type].name}！`);
                checkSpecialRules(item, targetTeam, r, c, attacker, coordStr);
            } else {
                log(`💦 [${attacker.name}] 砲擊 [${targetTeam.name}] 的 (${coordStr}) 落入海中激起水花。`);
                proceedToNextTurn();
            }

            renderBattleArea();
            checkAndApplyElimination();
        }

        function checkSpecialRules(item, targetTeam, r, c, attacker, coordStr) {
            let totalCellsOfItem = 0;
            let hitCellsOfItem = 0;
            let scoutShipPositions = [];

            for(let row=0; row<6; row++) {
                for(let col=0; col<6; col++) {
                    if(targetTeam.grid[row][col] && targetTeam.grid[row][col].id === item.id) {
                        totalCellsOfItem++;
                        scoutShipPositions.push({r: row, c: col});
                        if(targetTeam.hits[row][col]) hitCellsOfItem++;
                    }
                }
            }

            const isSunk = (totalCellsOfItem === hitCellsOfItem);

            if (item.type === 'torpedo') {
                log(`🚀 特殊連鎖：[${attacker.name}] 踩到了魚雷！自體相同座標 (${coordStr}) 遭連帶自爆！`);
                attacker.hits[r][c] = true; 
                if(attacker.grid[r][c]) {
                    log(`💥 悲劇！[${attacker.name}] 自己的 ${ITEM_CONFIGS[attacker.grid[r][c].type].name} 被自家觸發的魚雷炸到了！`);
                }
            }

            if (isSunk) {
                log(`🚢 戰報：[${targetTeam.name}] 的 ${ITEM_CONFIGS[item.type].name} 已被徹底擊沉！`);

                if (item.type === 'scoutShip') {
                    let posText = scoutShipPositions.map(p => `${colLabels[p.c]}${rowLabels[p.r]}`).join('、');
                    showOverlay("📡 偵查天眼開啟", `[${targetTeam.name}] 的偵查艦被擊沉！
該偵查艦 (2x1) 所在位置 (${posText}) 啟動偵查天眼！

全場所有對手該位置的道具將以「綠底」公開透視，其他組別仍須點選攻擊才算擊沉。`, () => {
                        for(let i=1; i<=totalTeams; i++) {
                            scoutShipPositions.forEach(pos => {
                                teams[i].revealed[pos.r][pos.c] = true;
                            });
                        }
                        proceedToNextTurn();
                        renderBattleArea();
                        checkAndApplyElimination();
                    });
                    return;
                }

                if (item.type === 'warship') {
                    revengeState = {
                        victimId: targetTeam.id,
                        attackerId: attacker.id
                    };
                    showOverlay("⚔️ 鐵甲巨艦死鬥反擊", `[${targetTeam.name}] 的軍艦被擊沉！觸發殊死復仇機制！

請點擊下方【繼續】按鈕，然後由 [${targetTeam.name}] 的玩家直接在畫面上點擊攻擊者 [${attacker.name}] 的任一盤面海域進行反向轟炸！`, () => {
                        // 點選繼續後關閉 overlay，留在復仇狀態等待點選
                    });
                    return;
                }
            }

            proceedToNextTurn();
        }

        function executeRevengeAttack(r, c) {
            const victim = teams[revengeState.victimId];
            const attacker = teams[revengeState.attackerId];

            attacker.hits[r][c] = true;
            const item = attacker.grid[r][c];
            const coordStr = `${colLabels[c]}${rowLabels[r]}`;

            if (item) {
                log(`🔥 復仇奇襲！[${victim.name}] 臨死反撲成功！重創 [${attacker.name}] 的 (${coordStr}) 座標，炸出 ${ITEM_CONFIGS[item.type].name}！`);
            } else {
                log(`💦 復仇反擊！[${victim.name}] 射出的炮彈偏離，在 [${attacker.name}] 的 (${coordStr}) 激起落空水花。`);
            }

            revengeState = null;
            document.getElementById('overlayScreen').classList.add('hidden');
            
            proceedToNextTurn();
            renderBattleArea();
            checkAndApplyElimination();
        }

        function proceedToNextTurn() {
            if (revengeState) return;
            currentTurnTeamId = (currentTurnTeamId % totalTeams) + 1;
            determineNextActiveTurn();
        }

        function checkAndApplyElimination() {
            for (let i = 1; i <= totalTeams; i++) {
                const team = teams[i];
                if (team.eliminated) continue;

                let operationalAssets = 0;
                let destroyedAssets = 0;

                for (let r = 0; r < 6; r++) {
                    for (let c = 0; c < 6; c++) {
                        const item = team.grid[r][c];
                        if (item && item.type !== 'torpedo') {
                            operationalAssets++;
                            if (team.hits[r][c]) destroyedAssets++;
                        }
                    }
                }

                if (operationalAssets > 0 && operationalAssets === destroyedAssets) {
                    team.eliminated = true;
                    log(`💀 淘汰公告：[${team.name}] 的所有戰艦皆已被擊沉，慘遭淘汰出局！`);
                }
            }

            let activeTeams = [];
            for (let i = 1; i <= totalTeams; i++) {
                if (!teams[i].eliminated) activeTeams.push(teams[i]);
            }

            if (activeTeams.length === 1) {
                showOverlay("🏆 榮耀終局 🏆", `恭喜 【${activeTeams[0].name}】 在這場驚險的微型海戰中，擊潰群雄，成為場上最終倖存的第一名！`, () => {
                    location.reload();
                });
            }
        }

        function log(msg) {
            const box = document.getElementById('logBox');
            box.innerHTML += `<div class="log-entry">＞ ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function showOverlay(title, desc, callback, isRevenge = false, isConfirmDialog = false) {
            const screen = document.getElementById('overlayScreen');
            document.getElementById('overlayTitle').innerText = title;
            document.getElementById('overlayDesc').innerText = desc;
            
            const area = document.getElementById('overlayActionArea');
            area.innerHTML = '';

            if (isConfirmDialog) {
                const btnContainer = document.createElement('div');
                btnContainer.className = 'overlay-btns';

                const btnConfirm = document.createElement('button');
                btnConfirm.innerText = "確定重新開始";
                btnConfirm.style.backgroundColor = "#e74c3c";
                btnConfirm.onclick = () => {
                    screen.classList.add('hidden');
                    if (callback) callback();
                };

                const btnCancel = document.createElement('button');
                btnCancel.innerText = "取消";
                btnCancel.style.backgroundColor = "#7f8c8d";
                btnCancel.onclick = () => {
                    screen.classList.add('hidden');
                };

                btnContainer.appendChild(btnConfirm);
                btnContainer.appendChild(btnCancel);
                area.appendChild(btnContainer);
            } else {
                const btn = document.createElement('button');
                btn.innerText = "繼續";
                btn.style.backgroundColor = "#2ecc71";
                btn.onclick = () => {
                    screen.classList.add('hidden');
                    if(callback) callback();
                };
                area.appendChild(btn);
            }
            screen.classList.remove('hidden');
        }
    </script>
</body>
</html>
